<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Web Spidey Fan — Remastered</title>
  <!-- Fonts: Anton for Marvel-style GAMEMAKE logo, Rajdhani/Inter for PS5 HUD -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <!-- Three.js r128 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020510;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #ffffff;
      touch-action: none;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ================= CINEMATIC MAIN MENU & VICTORY ================= */
    .overlay-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(
        180deg,
        rgba(2, 6, 20, 0.35) 0%,
        rgba(3, 10, 28, 0.58) 55%,
        rgba(2, 5, 16, 0.88) 100%
      );
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 30;
      transition: opacity 0.55s ease, visibility 0.55s ease;
      padding: 24px;
      text-align: center;
    }

    .overlay-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .menu-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(24px, 5vw, 44px) clamp(28px, 6vw, 64px);
      border-radius: 28px;
      background: rgba(6, 14, 34, 0.42);
      border: 1px solid rgba(147, 197, 253, 0.24);
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      margin-bottom: 42px;
    }

    .remastered-tag {
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 4.5px;
      text-transform: uppercase;
      color: #60a5fa;
      margin-bottom: 10px;
      text-shadow: 0 0 14px rgba(96, 165, 250, 0.85);
    }

    .game-title {
      font-size: clamp(2.4rem, 7.5vw, 4.9rem);
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 0%, #dbeafe 45%, #ef4444 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 6px 26px rgba(37, 99, 235, 0.65)) drop-shadow(0 0 14px rgba(239, 68, 68, 0.45));
      margin-bottom: 32px;
      line-height: 1.05;
    }

    .play-btn {
      position: relative;
      padding: 18px 64px;
      font-size: clamp(1.15rem, 3vw, 1.5rem);
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
      background: linear-gradient(135deg, #e11d2e 0%, #99111d 100%);
      border: 1.5px solid rgba(147, 197, 253, 0.7);
      border-radius: 999px;
      cursor: pointer;
      box-shadow:
        0 12px 36px rgba(225, 29, 46, 0.55),
        0 0 28px rgba(59, 130, 246, 0.45),
        inset 0 1px 1px rgba(255, 255, 255, 0.35);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease, filter 0.2s ease;
    }

    .play-btn:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow:
        0 16px 44px rgba(225, 29, 46, 0.72),
        0 0 38px rgba(96, 165, 250, 0.8);
      filter: brightness(1.1);
    }

    .play-btn:active {
      transform: translateY(1px) scale(0.97);
    }

    /* Marvel-style GAMEMAKE Studio Logo at bottom of main menu */
    .gamemake-brand {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }

    .gamemake-sub {
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 3.8px;
      text-transform: uppercase;
      color: rgba(226, 232, 240, 0.78);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    }

    .gamemake-logo {
      background: #ED1D24;
      color: #ffffff;
      padding: 4px 11px 2px 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 8px 30px rgba(237, 29, 36, 0.65),
        0 0 42px rgba(237, 29, 36, 0.35),
        0 2px 10px rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .gamemake-logo-text {
      font-family: 'Anton', Impact, 'Arial Narrow', 'Arial Black', sans-serif;
      font-size: clamp(1.8rem, 4.6vw, 2.55rem);
      font-weight: 900;
      line-height: 0.88;
      letter-spacing: -1.5px;
      text-transform: uppercase;
      display: inline-block;
      transform: scaleY(1.18) scaleX(0.92);
    }

    .victory-stats {
      font-size: 1.2rem;
      color: #dbeafe;
      margin-bottom: 26px;
      line-height: 1.6;
    }

    /* ================= PS5-INSPIRED HUD ================= */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      display: none;
    }

    #hud.active {
      display: block;
    }

    .hud-top-left {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hud-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      background: linear-gradient(135deg, rgba(8, 16, 38, 0.82), rgba(4, 10, 26, 0.68));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-left: 3.5px solid #3b82f6;
      border-top: 1px solid rgba(147, 197, 253, 0.25);
      border-right: 1px solid rgba(147, 197, 253, 0.15);
      border-bottom: 1px solid rgba(147, 197, 253, 0.15);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      font-size: clamp(0.92rem, 2.2vw, 1.12rem);
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .hud-pill.villain-pill {
      border-left-color: #ef4444;
    }

    .hud-money-val {
      color: #fde047;
      text-shadow: 0 0 12px rgba(253, 224, 71, 0.7);
    }

    .hud-villain-val {
      color: #f87171;
      text-shadow: 0 0 12px rgba(248, 113, 113, 0.65);
    }

    .controls-hint {
      position: absolute;
      top: 18px;
      right: 18px;
      padding: 10px 16px;
      background: rgba(6, 14, 34, 0.68);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(147, 197, 253, 0.22);
      border-radius: 14px;
      font-size: 0.78rem;
      color: #bfdbfe;
      text-align: right;
      line-height: 1.5;
    }

    @media (max-width: 740px) {
      .controls-hint {
        display: none;
      }
    }

    /* Sleek Circular + Numeric Web Hang Countdown */
    #web-timer-wrap {
      position: absolute;
      top: 19%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.85);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 22px 10px 14px;
      background: rgba(6, 15, 38, 0.84);
      backdrop-filter: blur(10px);
      border: 1.5px solid rgba(147, 197, 253, 0.75);
      border-radius: 999px;
      box-shadow: 0 0 32px rgba(59, 130, 246, 0.65);
      opacity: 0;
      transition: opacity 0.16s ease, transform 0.16s ease;
    }

    #web-timer-wrap.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .timer-ring {
      width: 34px;
      height: 34px;
      transform: rotate(-90deg);
    }

    .timer-ring-bg {
      fill: none;
      stroke: rgba(147, 197, 253, 0.22);
      stroke-width: 4;
    }

    .timer-ring-fg {
      fill: none;
      stroke: #60a5fa;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 88;
      stroke-dashoffset: 0;
    }

    #web-timer-text {
      font-size: 1.35rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.5px;
      min-width: 58px;
      text-align: left;
    }

    /* Floating toast feedback */
    #feedback-container {
      position: absolute;
      top: 32%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }

    .floating-toast {
      font-size: 1.18rem;
      font-weight: 900;
      padding: 7px 18px;
      border-radius: 999px;
      background: rgba(6, 14, 34, 0.8);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      animation: floatUpFade 1.05s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      white-space: nowrap;
    }

    .toast-money {
      color: #fde047;
      border-color: rgba(253, 224, 71, 0.7);
      text-shadow: 0 0 12px rgba(253, 224, 71, 0.85);
    }

    .toast-hit {
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.7);
    }

    .toast-info {
      color: #93c5fd;
      border-color: rgba(96, 165, 250, 0.5);
      font-size: 0.96rem;
    }

    @keyframes floatUpFade {
      0% { opacity: 0; transform: translateY(12px) scale(0.88); }
      18% { opacity: 1; transform: translateY(0) scale(1.05); }
      100% { opacity: 0; transform: translateY(-44px) scale(0.95); }
    }

    /* ================= ACTION BUTTONS (BOTTOM RIGHT) ================= */
    .action-buttons {
      position: absolute;
      bottom: 24px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      pointer-events: auto;
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 206px;
      padding: 15px 22px;
      border-radius: 18px;
      font-size: 1.02rem;
      font-weight: 800;
      color: #ffffff;
      cursor: pointer;
      border: 1.5px solid transparent;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.58);
      transition: transform 0.12s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }

    .action-btn:active {
      transform: scale(0.94);
    }

    .btn-web {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.92), rgba(29, 78, 216, 0.92));
      border-color: rgba(147, 197, 253, 0.85);
      box-shadow: 0 8px 26px rgba(37, 99, 235, 0.5);
    }

    .btn-web:hover {
      filter: brightness(1.12);
    }

    .btn-web.hanging {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      border-color: #ffffff;
      box-shadow: 0 0 28px rgba(56, 189, 248, 0.9);
    }

    .btn-attack {
      background: linear-gradient(135deg, rgba(225, 29, 46, 0.94), rgba(153, 17, 29, 0.94));
      border-color: rgba(252, 165, 165, 0.85);
      box-shadow: 0 8px 26px rgba(225, 29, 46, 0.5);
    }

    .btn-attack:hover {
      filter: brightness(1.12);
    }

    .key-badge {
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.28);
      font-weight: 700;
    }

    /* ================= TOUCH JOYSTICK (BOTTOM LEFT) ================= */
    #joystick-zone {
      position: absolute;
      bottom: 24px;
      left: 22px;
      width: 126px;
      height: 126px;
      border-radius: 50%;
      background: rgba(8, 18, 42, 0.45);
      backdrop-filter: blur(8px);
      border: 1.5px solid rgba(96, 165, 250, 0.48);
      box-shadow: inset 0 0 22px rgba(59, 130, 246, 0.25), 0 8px 24px rgba(0, 0, 0, 0.45);
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    #joystick-knob {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 32%, #f43f5e, #9f1239);
      border: 2px solid rgba(191, 219, 254, 0.9);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.55);
      transform: translate(0px, 0px);
      pointer-events: none;
    }

    @media (max-width: 540px) {
      .action-btn {
        min-width: 168px;
        padding: 13px 15px;
        font-size: 0.92rem;
      }
      .key-badge {
        display: none;
      }
      #joystick-zone {
        width: 112px;
        height: 112px;
        left: 16px;
        bottom: 20px;
      }
      .action-buttons {
        right: 14px;
        bottom: 20px;
      }
    }

    #error-box {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #020510;
      color: #fca5a5;
      z-index: 99;
      padding: 24px;
      text-align: center;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <!-- 3D Viewport -->
  <canvas id="game-canvas"></canvas>

  <!-- Cinematic Main Menu -->
  <div id="main-menu" class="overlay-screen">
    <div class="menu-card">
      <div class="remastered-tag">PS5 REMASTERED EDITION</div>
      <h1 class="game-title">Web Spidey Fan</h1>
      <button id="play-btn" class="play-btn">Играть</button>
    </div>

    <!-- Marvel-Style GAMEMAKE Studio Logo -->
    <div class="gamemake-brand">
      <span class="gamemake-sub">A STUDIO BY</span>
      <div class="gamemake-logo">
        <span class="gamemake-logo-text">GAMEMAKE</span>
      </div>
    </div>
  </div>

  <!-- Victory Screen -->
  <div id="victory-screen" class="overlay-screen hidden">
    <div class="menu-card">
      <div class="remastered-tag">МИССИЯ ВЫПОЛНЕНА</div>
      <h1 class="game-title">Город спасён!</h1>
      <div class="victory-stats">
        Все 100 злодеев в масках побеждены!<br />
        Итоговый баланс: <span id="victory-money" class="hud-money-val">0$</span>
      </div>
      <button id="restart-btn" class="play-btn">Играть снова</button>
    </div>
  </div>

  <!-- In-Game HUD -->
  <div id="hud">
    <div class="hud-top-left">
      <div class="hud-pill">
        <span>💰 Баланс:</span>
        <span id="hud-money" class="hud-money-val">$0</span>
      </div>
      <div class="hud-pill villain-pill">
        <span>🎭 Злодеи:</span>
        <span id="hud-villains" class="hud-villain-val">100 / 100</span>
      </div>
    </div>

    <div class="controls-hint">
      <b>WASD / Стрелки</b> — бег<br />
      <b>Мышь (зажать)</b> — поворот камеры<br />
      <b>E / Пробел</b> — Паутина &nbsp;|&nbsp; <b>F / Клик</b> — Удар
    </div>

    <!-- Circular + Numeric 3.0s Web Timer -->
    <div id="web-timer-wrap">
      <svg class="timer-ring" viewBox="0 0 36 36">
        <circle class="timer-ring-bg" cx="18" cy="18" r="14"></circle>
        <circle id="timer-ring-fg" class="timer-ring-fg" cx="18" cy="18" r="14"></circle>
      </svg>
      <span id="web-timer-text">3.0с</span>
    </div>

    <div id="feedback-container"></div>

    <!-- Mobile Touch Joystick -->
    <div id="joystick-zone" aria-label="Джойстик движения">
      <div id="joystick-knob"></div>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
      <button id="btn-web" class="action-btn btn-web">
        <span>🕸️ Паутина</span>
        <span class="key-badge">E / Space</span>
      </button>
      <button id="btn-attack" class="action-btn btn-attack">
        <span>👊 Ударить по врагу</span>
        <span class="key-badge">F</span>
      </button>
    </div>
  </div>

  <!-- WebGL Error Fallback -->
  <div id="error-box"></div>

  <script>
    /**
     * Web Spidey Fan — PS5 Remastered Edition
     * Single-file Three.js r128 PBR 3D Game
     *
     * Visual Highlights:
     * - ACESFilmicToneMapping + Procedural Night-City CubeTexture Environment Map
     * - Smooth LatheGeometry anatomical Spider-Man & 100 sculpted masked villains (ZERO cubes!)
     * - Multi-tiered Manhattan skyscrapers with setbacks, cornices, spires, rooftop HVAC, and PBR emissive glass
     * - Wet reflective asphalt streets with puddles (roughnessMap), crosswalks, curbs, and glowing streetlights
     * - Sleek sculpted multi-part cars with reflective glass cabins, 4 wheels, and glowing headlights
     * - Cratered glowing white moon with volumetric halo
     */

    (function () {
      'use strict';

      // ===================== GAME CONSTANTS =====================
      const CITY_GRID = 5;            // 5x5 Manhattan blocks = 25 multi-tiered skyscrapers
      const CELL_SIZE = 40;           // Block spacing
      const HALF_CITY = (CITY_GRID * CELL_SIZE) / 2; // 100 units
      const TOTAL_VILLAINS = 100;
      const TOTAL_MONEY_CIRCLES = 48;
      const TOTAL_CARS = 22;
      const PLAYER_SPEED = 17.0;
      const ATTACK_RANGE = 10.5;
      const WEB_HANG_DURATION = 3.0;  // Exactly 3.0 seconds
      const GRAVITY = 44.0;
      const TIMER_CIRCUMFERENCE = 2 * Math.PI * 14; // ~87.96

      // ===================== STATE =====================
      let scene, camera, renderer, envCubeTex;
      let gameStarted = false;
      let gameWon = false;
      let lastTime = 0;
      let animTime = 0;

      let money = 0;
      let remainingVillains = TOTAL_VILLAINS;

      const buildings = [];
      const villains = [];
      const moneyCircles = [];
      const cars = [];
      const particles = [];
      const beacons = [];
      const heartMaterials = {};

      // Player state
      const player = {
        group: null,
        bodyPivot: null,
        head: null,
        torso: null,
        leftArm: null,
        rightArm: null,
        leftForearm: null,
        rightForearm: null,
        leftLeg: null,
        rightLeg: null,
        leftShin: null,
        rightShin: null,
        rimLight: null,
        pos: new THREE.Vector3(0, 0, 20),
        velY: 0,
        yaw: Math.PI,
        runCycle: 0,
        isMoving: false,
        webState: 'ground', // 'ground' | 'hanging' | 'falling'
        webTimer: 0,
        webAnchor: new THREE.Vector3(),
        webHangTarget: new THREE.Vector3(),
        webLine: null,
        punchTimer: 0,
        comboSide: 1,
        lungeVel: new THREE.Vector3()
      };

      // Camera orbit state
      let camYaw = 0;
      let camPitch = 0.24;
      let currentFov = 60;
      let isDraggingCam = false;
      let pointerDownX = 0;
      let pointerDownY = 0;
      let lastPointerX = 0;
      let lastPointerY = 0;
      let pointerMovedDist = 0;

      // Inputs
      const keys = Object.create(null);
      const joyInput = { x: 0, y: 0, active: false, id: null };

      // DOM Refs
      const canvas = document.getElementById('game-canvas');
      const mainMenu = document.getElementById('main-menu');
      const victoryScreen = document.getElementById('victory-screen');
      const victoryMoneyEl = document.getElementById('victory-money');
      const hud = document.getElementById('hud');
      const hudMoney = document.getElementById('hud-money');
      const hudVillains = document.getElementById('hud-villains');
      const webTimerWrap = document.getElementById('web-timer-wrap');
      const webTimerText = document.getElementById('web-timer-text');
      const timerRingFg = document.getElementById('timer-ring-fg');
      const feedbackContainer = document.getElementById('feedback-container');
      const btnWeb = document.getElementById('btn-web');
      const btnAttack = document.getElementById('btn-attack');
      const joyZone = document.getElementById('joystick-zone');
      const joyKnob = document.getElementById('joystick-knob');
      const errorBox = document.getElementById('error-box');

      const _v1 = new THREE.Vector3();
      const _v2 = new THREE.Vector3();

      // ===================== SMOOTH ANATOMICAL GEOMETRY HELPERS =====================

      /**
       * Creates a smooth, non-blocky tapered anatomical capsule using LatheGeometry (Three.js r128 compatible)
       * rTop, rMid, rBot allow realistic muscular/athletic tapering
       */
      function createTaperedCapsule(rTop, rMid, rBot, height, radialSegs = 14) {
        const pts = [];
        const halfH = height * 0.5;
        const capSteps = 5;

        // Bottom hemispherical cap
        for (let i = 0; i <= capSteps; i++) {
          const t = (i / capSteps) * (Math.PI * 0.5);
          const x = Math.sin(t) * rBot;
          const y = -halfH - Math.cos(t) * rBot;
          pts.push(new THREE.Vector2(Math.max(0.001, x), y));
        }

        // Smooth contoured shaft (bottom -> mid -> top)
        pts.push(new THREE.Vector2(rMid, 0));
        pts.push(new THREE.Vector2(rTop, halfH));

        // Top hemispherical cap
        for (let i = 1; i <= capSteps; i++) {
          const t = (i / capSteps) * (Math.PI * 0.5);
          const x = Math.cos(t) * rTop;
          const y = halfH + Math.sin(t) * rTop;
          pts.push(new THREE.Vector2(Math.max(0.001, x), y));
        }

        const geo = new THREE.LatheGeometry(pts, radialSegs);
        geo.computeVertexNormals();
        return geo;
      }

      /**
       * Creates an athletic V-tapered humanoid torso using LatheGeometry
       */
      function createAthleticTorsoGeo(scale = 1.0) {
        const pts = [
          new THREE.Vector2(0.001, -0.52 * scale),

          new THREE.Vector2(0.25 * scale, -0.10 * scale),  // Tapered waist

          new THREE.Vector2(0.32 * scale, 0.48 * scale),   // Shoulders slope

      /**

      function createSculptedHeadGeo(scale = 1.0) {

      // ===================== PROCEDURAL PBR TEXTURES =====================

      /**
       * Generates a procedural Night-City CubeTexture for realistic PBR reflections
       * on wet asphalt, skyscraper glass, car windows, and Spider-Man's suit sheen.
       */
      function createNightCityEnvMap() {
        const faces = [];
        for (let f = 0; f < 6; f++) {
          const c = document.createElement('canvas');
          c.width = 128;
          c.height = 128;
          const ctx = c.getContext('2d');

          if (f === 2) {
            // Top (+Y): Deep night zenith + faint moonlight
            const g = ctx.createRadialGradient(40, 40, 4, 64, 64, 90);
            g.addColorStop(0, '#93c5fd');
            g.addColorStop(0.35, '#0c1b3d');
            g.addColorStop(1, '#020510');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 128, 128);
          } else if (f === 3) {
            // Bottom (-Y): Dark asphalt bounce
            ctx.fillStyle = '#060c1c';
            ctx.fillRect(0, 0, 128, 128);
          } else {
            // Side horizons: Dark sky fading to glowing blue neon skyline
            const g = ctx.createLinearGradient(0, 0, 0, 128);
            g.addColorStop(0, '#020614');
            g.addColorStop(0.45, '#0a1c42');
            g.addColorStop(0.62, '#2563eb');
            g.addColorStop(0.75, '#0f2554');
            g.addColorStop(1, '#040814');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 128, 128);

            // Bright neon blue/cyan window streaks for crisp reflections
            for (let i = 0; i < 28; i++) {
              ctx.fillStyle = i % 3 === 0 ? 'rgba(186, 230, 253, 0.8)' : 'rgba(59, 130, 246, 0.75)';
              ctx.fillRect(Math.random() * 120, 52 + Math.random() * 44, 3 + Math.random() * 8, 2 + Math.random() * 6);
            }
          }
          faces.push(c);
        }
        const cubeTex = new THREE.CubeTexture(faces);
        cubeTex.needsUpdate = true;
        return cubeTex;
      }

      /**
       * High-res procedural PBR Manhattan glass & concrete skyscraper textures
       * Returns { map, emissiveMap, roughnessMap }
       */
      function createSkyscraperPBRTextures() {
        const w = 512, h = 512;
        const cMap = document.createElement('canvas');
        const cEmissive = document.createElement('canvas');
        const cRough = document.createElement('canvas');
        cMap.width = cEmissive.width = cRough.width = w;
        cMap.height = cEmissive.height = cRough.height = h;

        const ctxM = cMap.getContext('2d');
        const ctxE = cEmissive.getContext('2d');
        const ctxR = cRough.getContext('2d');

        // Concrete / dark architectural metal frame
        ctxM.fillStyle = '#0c1324';
        ctxM.fillRect(0, 0, w, h);
        ctxE.fillStyle = '#000000';
        ctxE.fillRect(0, 0, w, h);
        ctxR.fillStyle = '#c8c8c8'; // Rough concrete mullions
        ctxR.fillRect(0, 0, w, h);

        const cols = 8;
        const rows = 14;
        const padX = 8;
        const padY = 9;
        const winW = (w - padX * (cols + 1)) / cols;
        const winH = (h - padY * (rows + 1)) / rows;

        for (let r = 0; r < rows; r++) {
          // Architectural floor spandrel band
          const bandY = padY + r * (winH + padY) - 4;
          ctxM.fillStyle = '#14203b';
          ctxM.fillRect(0, bandY, w, 3);

          for (let col = 0; col < cols; col++) {
            const x = padX + col * (winW + padX);
            const y = padY + r * (winH + padY);

            // Smooth glossy glass in roughness map
            ctxR.fillStyle = '#1a1a1a';
            ctxR.fillRect(x, y, winW, winH);

            const rnd = Math.random();
            if (rnd > 0.28) {
              // Lit interior office window (cool blue, cyan, or crisp white-blue)
              const g = ctxE.createLinearGradient(x, y, x, y + winH);
              if (rnd > 0.84) {
                g.addColorStop(0, '#e0f2fe');
                g.addColorStop(1, '#38bdf8');
              } else if (rnd > 0.56) {
                g.addColorStop(0, '#60a5fa');
                g.addColorStop(1, '#1d4ed8');
              } else {
                g.addColorStop(0, '#38bdf8');
                g.addColorStop(1, '#1e40af');
              }
              ctxE.fillStyle = g;
              ctxE.fillRect(x + 1, y + 1, winW - 2, winH - 2);

              ctxM.fillStyle = '#1e3a8a';
              ctxM.fillRect(x, y, winW, winH);

              // Subtle interior blinds/ceiling line detail
              ctxE.fillStyle = 'rgba(2, 8, 24, 0.32)';
              ctxE.fillRect(x + 1, y + winH * 0.55, winW - 2, 2);
            } else {
              // Dark reflective glass window
              ctxM.fillStyle = '#091530';
              ctxM.fillRect(x, y, winW, winH);
            }
          }
        }

        // Sleek vertical blue neon architectural edge trims
        ctxE.fillStyle = '#3b82f6';
        ctxE.fillRect(0, 0, 5, h);
        ctxE.fillRect(w - 5, 0, 5, h);

        const map = new THREE.CanvasTexture(cMap);
        const emissiveMap = new THREE.CanvasTexture(cEmissive);
        const roughnessMap = new THREE.CanvasTexture(cRough);
        map.encoding = THREE.sRGBEncoding;
        emissiveMap.encoding = THREE.sRGBEncoding;

        [map, emissiveMap, roughnessMap].forEach(t => {
          t.wrapS = THREE.RepeatWrapping;
          t.wrapT = THREE.RepeatWrapping;
        });

        return { map, emissiveMap, roughnessMap };
      }

      /**
       * Wet reflective Manhattan asphalt street texture + puddle roughnessMap
       */
      function createWetAsphaltTextures() {
        const size = 512;
        const cDiff = document.createElement('canvas');
        const cRough = document.createElement('canvas');
        cDiff.width = cRough.width = size;
        cDiff.height = cRough.height = size;
        const ctxD = cDiff.getContext('2d');
        const ctxR = cRough.getContext('2d');

        // Dark wet asphalt base
        ctxD.fillStyle = '#0c101b';
        ctxD.fillRect(0, 0, size, size);

        // Damp base roughness (medium-low)
        ctxR.fillStyle = '#686868';
        ctxR.fillRect(0, 0, size, size);

        // Subtle asphalt grain
        for (let i = 0; i < 2400; i++) {
          const gx = Math.random() * size;
          const gy = Math.random() * size;
          const v = 14 + Math.floor(Math.random() * 18);
          ctxD.fillStyle = `rgb(${v},${v + 3},${v + 10})`;
          ctxD.fillRect(gx, gy, 2, 2);
        }

        // Glossy rain puddles (very dark in roughnessMap -> mirror-like reflection)
        for (let p = 0; p < 16; p++) {
          const px = Math.random() * size;
          const py = Math.random() * size;
          const pr = 28 + Math.random() * 58;
          const g = ctxR.createRadialGradient(px, py, 4, px, py, pr);
          g.addColorStop(0, '#0a0a0a');
          g.addColorStop(0.65, '#1c1c1c');
          g.addColorStop(1, 'rgba(104,104,104,0)');
          ctxR.fillStyle = g;
          ctxR.beginPath();
          ctxR.arc(px, py, pr, 0, Math.PI * 2);
          ctxR.fill();
        }

        const map = new THREE.CanvasTexture(cDiff);
        const roughnessMap = new THREE.CanvasTexture(cRough);
        map.encoding = THREE.sRGBEncoding;
        [map, roughnessMap].forEach(t => {
          t.wrapS = THREE.RepeatWrapping;
          t.wrapT = THREE.RepeatWrapping;
          t.repeat.set(16, 16);
        });

        return { map, roughnessMap };
      }

      /**
       * Realistic cratered Moon diffuse + bump texture
       */
      function createMoonTextures() {
        const size = 512;
        const c = document.createElement('canvas');
        c.width = c.height = size;
        const ctx = c.getContext('2d');

        // Bright silver-white lunar surface
        const bg = ctx.createRadialGradient(256, 256, 40, 256, 256, 300);
        bg.addColorStop(0, '#ffffff');
        bg.addColorStop(1, '#d8e4f5');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, size, size);

        // Soft lunar maria (subtle dark grey plains)
        for (let i = 0; i < 18; i++) {
          const x = Math.random() * size;
          const y = Math.random() * size;
          const r = 24 + Math.random() * 56;
          const g = ctx.createRadialGradient(x, y, 2, x, y, r);
          g.addColorStop(0, 'rgba(148, 163, 184, 0.32)');
          g.addColorStop(1, 'rgba(148, 163, 184, 0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        }

        // Crisp impact craters
        for (let i = 0; i < 65; i++) {
          const x = Math.random() * size;
          const y = Math.random() * size;
          const r = 4 + Math.random() * 18;
          ctx.fillStyle = 'rgba(100, 116, 139, 0.25)';
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.arc(x - 1, y - 1, r, 0, Math.PI * 2);
          ctx.stroke();
        }

        const tex = new THREE.CanvasTexture(c);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      /**
       * Soft radial volumetric glow sprite texture
       */
      function createGlowSpriteTexture(innerColor, midColor, outerColor) {
        const c = document.createElement('canvas');
        c.width = c.height = 128;
        const ctx = c.getContext('2d');
        const g = ctx.createRadialGradient(64, 64, 4, 64, 64, 64);
        g.addColorStop(0, innerColor);
        g.addColorStop(0.38, midColor);

      }

      /**
       * Spider-Man Remastered Mask Texture (Equirectangular / Lathe UV mapped)
       * Front of face aligns at u = 0.25 (or +Z depending on rotation)
       */
      function createSpideyMaskPBR() {
        const w = 512, h = 256;
        const c = document.createElement('canvas');
        const b = document.createElement('canvas');
        c.width = b.width = w;
        c.height = b.height = h;
        const ctx = c.getContext('2d');
        const btx = b.getContext('2d');

        // Deep crimson fabric base
        ctx.fillStyle = '#c81020';
        ctx.fillRect(0, 0, w, h);

        // Micro-weave fabric bump
        btx.fillStyle = '#808080';
        btx.fillRect(0, 0, w, h);
        btx.fillStyle = '#9a9a9a';
        for (let y = 0; y < h; y += 4) {
          for (let x = 0; x < w; x += 4) {
            if ((x + y) % 8 === 0) btx.fillRect(x, y, 2, 2);
          }
        }

        // Center of face at x = 256, y = 132
        const cx = 256, cy = 132;

        // Crisp black spider-web lines radiating from nose bridge
        ctx.strokeStyle = 'rgba(10, 10, 14, 0.88)';
        ctx.lineWidth = 2.4;
        btx.strokeStyle = '#303030';
        btx.lineWidth = 3;

        for (let i = 0; i < 20; i++) {
          const ang = (i / 20) * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx + Math.cos(ang) * 280, cy + Math.sin(ang) * 180);
          ctx.stroke();

          btx.beginPath();
          btx.moveTo(cx, cy);
          btx.lineTo(cx + Math.cos(ang) * 280, cy + Math.sin(ang) * 180);
          btx.stroke();
        }
        for (let r = 24; r <= 220; r += 26) {
          ctx.beginPath();
          ctx.ellipse(cx, cy, r * 1.15, r * 0.85, 0, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Sleek expressive Spider-Man Remastered Eye Lenses
        function drawLens(dir) {
          ctx.save();
          ctx.translate(cx + dir * 48, cy - 16);
          ctx.scale(dir, 1);

          // Thick aerodynamic matte-black frame
          ctx.beginPath();
          ctx.moveTo(-28, 15);
          ctx.quadraticCurveTo(-6, -26, 36, -22);
          ctx.quadraticCurveTo(26, 20, -28, 15);
          ctx.closePath();
          ctx.fillStyle = '#07080c';
          ctx.fill();

          // Luminous expressive white lens with subtle cyan-white sheen
          const lg = ctx.createLinearGradient(-16, -12, 22, 12);
          lg.addColorStop(0, '#ffffff');
          lg.addColorStop(1, '#dbeafe');
          ctx.beginPath();
          ctx.moveTo(-19, 10);
          ctx.quadraticCurveTo(-4, -15, 25, -13);
          ctx.quadraticCurveTo(18, 12, -19, 10);
          ctx.closePath();
          ctx.fillStyle = lg;
          ctx.fill();
          ctx.restore();
        }

        drawLens(-1);
        drawLens(1);

        const map = new THREE.CanvasTexture(c);
        const bumpMap = new THREE.CanvasTexture(b);
        map.encoding = THREE.sRGBEncoding;
        return { map, bumpMap };
      }

      /**
       * Spider-Man Remastered Torso Suit Texture (Crimson + Metallic Midnight Blue + Webbing + Sharp Spider Emblem)
       */
      function createSpideyTorsoPBR() {
        const w = 512, h = 256;
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        const ctx = c.getContext('2d');

        // Metallic midnight blue suit base
        ctx.fillStyle = '#102a6b';
        ctx.fillRect(0, 0, w, h);

        // Front & back crimson chest V-panels (centered at x = 256 for front, x = 0/512 for back)
        function drawChestPanel(centerX, isFront) {
          ctx.save();
          ctx.fillStyle = '#cc1122';
          ctx.beginPath();
          ctx.moveTo(centerX - 88, 0);
          ctx.lineTo(centerX + 88, 0);
          ctx.lineTo(centerX + 68, 118);
          ctx.lineTo(centerX + 38, 212);
          ctx.lineTo(centerX - 38, 212);
          ctx.lineTo(centerX - 68, 118);
          ctx.closePath();
          ctx.fill();

          // Crisp black webbing on red panel
          ctx.strokeStyle = 'rgba(10, 10, 14, 0.78)';
          ctx.lineWidth = 2;
          for (let dx = -72; dx <= 72; dx += 24) {
            ctx.beginPath();
            ctx.moveTo(centerX + dx, 0);
            ctx.lineTo(centerX + dx * 0.48, 215);
            ctx.stroke();
          }
          for (let y = 20; y <= 210; y += 24) {
            ctx.beginPath();
            ctx.moveTo(centerX - 85, y);
            ctx.lineTo(centerX + 85, y);
            ctx.stroke();
          }

          // PS5 Advanced Suit-inspired sharp Spider Emblem (crisp white with black outline!)
          ctx.strokeStyle = '#09090b';
          ctx.fillStyle = isFront ? '#f8fafc' : '#f8fafc';
          ctx.lineWidth = 6;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          // Outline pass then white pass for sharp iconic readability
          const passes = [
            { color: '#09090b', lw: 7.5 },
            { color: '#f8fafc', lw: 3.8 }
          ];
          passes.forEach(p => {
            ctx.strokeStyle = p.color;
            ctx.fillStyle = p.color;
            ctx.lineWidth = p.lw;

            // Abdomen & thorax
            ctx.beginPath();
            ctx.ellipse(centerX, 82, 7, 11, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(centerX, 104, 10, 17, 0, 0, Math.PI * 2);
            ctx.fill();

            // 8 angular athletic spider legs
            const legs = [
              [centerX, 82, centerX - 28, 54, centerX - 44, 24],
              [centerX, 88, centerX - 36, 74, centerX - 54, 56],
              [centerX, 98, centerX - 36, 110, centerX - 50, 140],
              [centerX, 106, centerX - 24, 134, centerX - 34, 168]
            ];
            legs.forEach(([x0, y0, x1, y1, x2, y2]) => {
              ctx.beginPath();
              ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2);
              ctx.stroke();
              ctx.beginPath();
              ctx.moveTo(centerX * 2 - x0, y0);
              ctx.lineTo(centerX * 2 - x1, y1);
              ctx.lineTo(centerX * 2 - x2, y2);
              ctx.stroke();
            });
          });
          ctx.restore();
        }

        // Red waist belt
        ctx.fillStyle = '#cc1122';
        ctx.fillRect(0, 206, w, 50);

        drawChestPanel(256, true);
        drawChestPanel(0, false);
        drawChestPanel(512, false);

        const tex = new THREE.CanvasTexture(c);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      /**

      /**
       * Pre-generates ONLY 3 shared glowing red heart sprite materials (for 3, 2, 1 HP)
       */
      function createHeartMaterials() {
        for (let count = 1; count <= 3; count++) {
          const c = document.createElement('canvas');
          c.width = 192;
          c.height = 64;
          const ctx = c.getContext('2d');
          ctx.clearRect(0, 0, 192, 64);

          ctx.shadowColor = '#ff1e4d';
          ctx.shadowBlur = 14;

          const spacing = 54;
          const startX = 96 - ((count - 1) * spacing) / 2;

          for (let i = 0; i < count; i++) {
            const hx = startX + i * spacing;
            const hy = 34;
            ctx.fillStyle = '#ff244c';
            ctx.beginPath();
            ctx.moveTo(hx, hy + 16);
            ctx.bezierCurveTo(hx - 22, hy + 2, hx - 22, hy - 18, hx - 9, hy - 18);
            ctx.bezierCurveTo(hx - 2, hy - 18, hx, hy - 11, hx, hy - 8);
            ctx.bezierCurveTo(hx, hy - 11, hx + 2, hy - 18, hx + 9, hy - 18);
            ctx.bezierCurveTo(hx + 22, hy - 18, hx + 22, hy + 2, hx, hy + 16);
            ctx.closePath();
            ctx.fill();

            // Specular highlight
            ctx.fillStyle = 'rgba(255,255,255,0.65)';
            ctx.beginPath();
            ctx.arc(hx - 7, hy - 9, 3.2, 0, Math.PI * 2);
            ctx.fill();
          }

          const tex = new THREE.CanvasTexture(c);
          tex.encoding = THREE.sRGBEncoding;
          heartMaterials[count] = new THREE.SpriteMaterial({
            map: tex,
            transparent: true,
            depthTest: true
          });
        }
      }
